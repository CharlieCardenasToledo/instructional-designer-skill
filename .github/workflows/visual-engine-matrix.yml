name: Visual engine matrix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-render:
    name: Real render (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      JINTIA_EXPECT_VISUAL_TOOLS: graphviz,mermaid,plantuml,d2,vegaLite,latex,python,chrome,wavedrom
      JINTIA_REAL_RENDER_TESTS: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Graphviz (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes graphviz plantuml texlive-latex-extra texlive-pictures
      - name: Install Graphviz (macOS)
        if: runner.os == 'macOS'
        run: brew install graphviz plantuml d2 && brew install --cask basictex
      - name: Install Graphviz (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install graphviz plantuml d2 miktex --yes --no-progress
          $pathEntries = [Environment]::GetEnvironmentVariable("Path", "Machine").Split(";") |
            Where-Object { $_ }
          $pathEntries += "C:\ProgramData\chocolatey\bin"
          $d2Files = Get-ChildItem -LiteralPath "$env:ChocolateyInstall\lib" -Filter "d2.exe" -Recurse -File -ErrorAction SilentlyContinue
          $pathEntries += $d2Files | ForEach-Object { $_.DirectoryName }
          $pathEntries |
            Sort-Object -Unique |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:Path = (($pathEntries + $env:Path) -join ";")
          if (-not (Get-Command d2.exe -ErrorAction SilentlyContinue)) {
            throw "D2 quedó instalado, pero no está disponible en PATH."
          }
          d2 version

      - name: Install D2 (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: curl -fsSL https://d2lang.com/install.sh | sh -s --

      - name: Install Python visual libraries
        run: python -m pip install matplotlib geopandas cairosvg rdkit

      - name: Install LaTeX disciplinary packages (macOS)
        if: runner.os == 'macOS'
        run: |
          sudo /Library/TeX/texbin/tlmgr update --self
          sudo /Library/TeX/texbin/tlmgr install standalone pgfplots circuitikz chemfig forest
          echo "/Library/TeX/texbin" >> "$GITHUB_PATH"

      - name: Refresh MiKTeX packages (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $miktexBin = "C:\Program Files\MiKTeX\miktex\bin\x64"
          & "$miktexBin\initexmf.exe" --admin --update-fndb
          $miktexBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install portable visual CLIs
        run: npm install --global @mermaid-js/mermaid-cli vega-cli vega-lite wavedrom-cli

      - name: Configure Chrome (Linux)
        if: runner.os == 'Linux'
        run: echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Configure Chrome (macOS)
        if: runner.os == 'macOS'
        run: echo "CHROME_PATH=/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" >> "$GITHUB_ENV"

      - name: Verify real engine availability
        run: node skill/scripts/visual-matrix-check.js
      - name: Run visual tests with real Chrome rendering
        run: npm --prefix skill test
