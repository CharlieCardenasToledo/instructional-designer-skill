name: Release Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  actions: read
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app/desktop
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run docs:check
        working-directory: .
      - run: npm test
      - run: npm run tauri:build
      - name: Upload unsigned Windows artifacts
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@v4
        with:
          name: instructional-designer-manager-windows-unsigned
          retention-days: 7
          path: |
            app/desktop/src-tauri/target/release/bundle/nsis/*.exe
            app/desktop/src-tauri/target/release/bundle/msi/*.msi

      - name: Submit artifacts to SignPath
        if: vars.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-artifact.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: ${{ runner.temp }}/signpath-signed

      - name: Verify signed artifacts
        if: vars.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        working-directory: .
        run: |
          $files = Get-ChildItem -LiteralPath '${{ runner.temp }}/signpath-signed' -Recurse -File |
            Where-Object { $_.Extension -in '.exe', '.msi' }
          if (-not $files) {
            throw 'SignPath did not return an EXE or MSI artifact.'
          }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne 'Valid') {
              throw "Invalid Authenticode signature for $($file.FullName): $($signature.Status)"
            }
            Write-Host "Valid signature: $($file.Name) — $($signature.SignerCertificate.Subject)"
          }

      - name: Upload signed Windows artifacts
        if: vars.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: instructional-designer-manager-windows-signed
          if-no-files-found: error
          path: ${{ runner.temp }}/signpath-signed

      - name: Publish signed GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/') && vars.SIGNPATH_ENABLED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          append_body: true
          files: |
            ${{ runner.temp }}/signpath-signed/**/*.exe
            ${{ runner.temp }}/signpath-signed/**/*.msi
          body: |
            Windows artifacts in this release are Authenticode signed.
            Free code signing provided by SignPath.io, certificate by SignPath Foundation.

      - name: Publish unsigned GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/') && vars.SIGNPATH_ENABLED != 'true'
        uses: softprops/action-gh-release@v2
        with:
          append_body: true
          files: |
            app/desktop/src-tauri/target/release/bundle/nsis/*.exe
            app/desktop/src-tauri/target/release/bundle/msi/*.msi
          body: |
            Windows artifacts in this release are not digitally signed.
            See CODE_SIGNING_POLICY.md for the SignPath Foundation application status.
