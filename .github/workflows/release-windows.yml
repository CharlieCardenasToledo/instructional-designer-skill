name: Release Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop-manager/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm test
      - run: npm run tauri:build
      - uses: actions/upload-artifact@v4
        with:
          name: instructional-designer-manager-windows
          path: |
            desktop-manager/src-tauri/target/release/bundle/nsis/*.exe
            desktop-manager/src-tauri/target/release/bundle/msi/*.msi
      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop-manager/src-tauri/target/release/bundle/nsis/*.exe
            desktop-manager/src-tauri/target/release/bundle/msi/*.msi
