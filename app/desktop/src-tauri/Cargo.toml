[package]
name = "jintia-desktop"
version = "1.0.0"
description = "Aplicación de escritorio de Jintia para diseño instruccional"
authors = ["Charlie Cárdenas Toledo"]
license = "MIT"
repository = "https://github.com/CharlieCardenasToledo/instructional-designer-skill"
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "jintia-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
include_dir = "0.7"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
scraper = "0.22"
regex = "1"
url = "2"
toml_edit = "0.22"

[package.metadata.tauri]
# sin configuración extra necesaria

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
