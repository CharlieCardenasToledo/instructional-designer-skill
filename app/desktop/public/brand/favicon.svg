<svg xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1024 1024"
  width="1024"
  height="1024"
  role="img"
  aria-labelledby="title desc">
  <title id="title">Icono de la aplicación Jintia</title>
  <desc id="desc">Icono cuadrado azul profundo con la letra J convertida en camino, punto turquesa y flecha verde.</desc>

  <defs>
    <linearGradient id="icon-bg" x1="132" y1="98" x2="892" y2="926" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#132E4D"/>
      <stop offset="0.52" stop-color="#0D1B2A"/>
      <stop offset="1" stop-color="#071321"/>
    </linearGradient>

    <linearGradient id="j-white" x1="310" y1="740" x2="650" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EAF4F6"/>
      <stop offset="0.5" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>

    <linearGradient id="jintia-teal" x1="285" y1="785" x2="370" y2="690" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A8F95"/>
      <stop offset="1" stop-color="#12B3AA"/>
    </linearGradient>

    <linearGradient id="jintia-green" x1="610" y1="330" x2="760" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#13B889"/>
      <stop offset="1" stop-color="#34C37A"/>
    </linearGradient>

    <filter id="mark-shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#020A12" flood-opacity="0.28"/>
    </filter>

    <filter id="soft-highlight" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- Fondo con esquinas redondeadas y transparencia exterior -->
  <rect x="42" y="42" width="940" height="940" rx="212" fill="url(#icon-bg)"/>

  <!-- Brillo ambiental muy sutil -->
  <ellipse cx="690" cy="250" rx="250" ry="180" fill="#0FA3A3" opacity="0.08" filter="url(#soft-highlight)"/>

  <!-- Isotipo aprobado, conservando exactamente su geometría -->
  <g transform="translate(26.4 -33.6) scale(2.7)" filter="url(#mark-shadow)">
    <!-- Cuerpo inferior de la J -->
    <path fill="url(#j-white)"
          d="
            M 218 159
            L 182 187
            L 182 232
            C 181.60 233.87, 180.07 242.93, 179.00 246.00
            C 177.93 249.07, 175.47 253.00, 174.00 255.00
            C 172.53 257.00, 170.40 259.40, 168.00 261.00
            C 165.60 262.60, 159.33 266.20, 156.00 267.00
            C 152.67 267.80, 145.80 267.53, 143.00 267.00
            C 140.20 266.47, 136.60 262.33, 135.00 263.00
            C 133.40 263.67, 132.47 269.73, 131.00 272.00
            C 129.53 274.27, 126.13 278.27, 124.00 280.00
            C 121.87 281.73, 117.27 284.20, 115.00 285.00
            C 112.73 285.80, 107.53 285.33, 107.00 286.00
            C 106.47 286.67, 107.27 287.87, 111.00 290.00
            C 114.73 292.13, 128.87 300.13, 135.00 302.00
            C 141.13 303.87, 153.00 304.93, 157.00 304.00
            C 161.00 303.07, 180.00 298.80, 184.00 296.00
            C 188.00 293.20, 199.07 283.27, 202.00 281.00
            C 204.93 278.73, 211.00 265.47, 213.00 262.00
            C 215.00 258.53, 216.47 249.00, 217.00 247.00
            L 218 159
            Z"/>

    <!-- Tramo superior de la J -->
    <path fill="url(#j-white)"
          d="
            M 217 109
            L 184 141
            C 182 144, 181 148, 181 151
            L 181 170
            L 223 137
            L 223 115
            Z"/>

    <!-- Punto de inicio -->
    <circle cx="106" cy="257" r="18.5" fill="url(#jintia-teal)"/>

    <!-- Flecha de avance -->
    <path fill="url(#jintia-green)"
          d="
            M 218 88
            L 271 89
            L 245 135
            C 242 126, 239 117, 235 109
            Z"/>
  </g>
</svg>
